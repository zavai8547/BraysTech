name: Deploy BraysTech

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Publish
        run: dotnet publish BraysTech.csproj --configuration Release --output ./publish

      - name: Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          server: ${{ secrets.BRAYS_FTP_SERVER }}
          username: ${{ secrets.BRAYS_FTP_USERNAME }}
          password: ${{ secrets.BRAYS_FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /site1/
          timeout: 120000
          retry-count: 3
          exclude: |
            **/.git*
            **/.git*/**
            **/appsettings.Development.json
            **/appsettings.json