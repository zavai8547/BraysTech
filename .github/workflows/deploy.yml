name: Deploy BraysTech

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: dotnet publish --configuration Release --output ./publish

      - name: Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.BRAYS_FTP_SERVER }}
          username: ${{ secrets.BRAYS_FTP_USERNAME }}
          password: ${{ secrets.BRAYS_FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /site1/
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/appsettings.Development.json
            **/appsettings.json