name: Deploy BraysTech to SmarterASP

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish --configuration Release --no-build --output ./publish

      - name: Create app_offline.htm to stop running app
        run: |
          mkdir -p ./offline
          echo "<html><body><h2>Updating, back shortly...</h2></body></html>" > ./offline/app_offline.htm

      - name: Upload app_offline.htm
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.BRAYS_FTP_SERVER }}
          username: ${{ secrets.BRAYS_FTP_USERNAME }}
          password: ${{ secrets.BRAYS_FTP_PASSWORD }}
          local-dir: ./offline/
          server-dir: ${{ secrets.BRAYS_FTP_PATH }}

      - name: Wait 15 seconds for IIS to release files
        run: sleep 15

      # The main deployment push
      - name: Deploy application files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.BRAYS_FTP_SERVER }}
          username: ${{ secrets.BRAYS_FTP_USERNAME }}
          password: ${{ secrets.BRAYS_FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: ${{ secrets.BRAYS_FTP_PATH }}
          exclude: |
            **/.git*
            **/.git*/**
            **/appsettings.Development.json
            **/appsettings.json
            app_offline.htm

      # FIX: Instead of an empty folder, we create a blank file named app_offline.htm
      # Overwriting it with a 0-byte file makes IIS ignore it and brings the site back online!
      - name: Clear app_offline.htm contents
        run: |
          mkdir -p ./bring-online
          touch ./bring-online/app_offline.htm

      - name: Overwrite app_offline on server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.BRAYS_FTP_SERVER }}
          username: ${{ secrets.BRAYS_FTP_USERNAME }}
          password: ${{ secrets.BRAYS_FTP_PASSWORD }}
          local-dir: ./bring-online/
          server-dir: ${{ secrets.BRAYS_FTP_PATH }}
          log-level: verbose