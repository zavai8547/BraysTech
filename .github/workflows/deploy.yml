name: Deploy BraysTech to SmarterASP

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish --configuration Release --no-build --output ./publish

      # 1. Block incoming requests while updating
      - name: Create app_offline.htm to stop running app
        run: |
          mkdir -p ./offline
          echo "<html><body><h2>Updating, back shortly...</h2></body></html>" > ./offline/app_offline.htm

      - name: Upload app_offline.htm
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.BRAYS_FTP_SERVER }}
          username: ${{ secrets.BRAYS_FTP_USERNAME }}
          password: ${{ secrets.BRAYS_FTP_PASSWORD }}
          local-dir: ./offline/
          server-dir: ${{ secrets.BRAYS_FTP_PATH }}

      - name: Wait 15 seconds for IIS to release files
        run: sleep 15

      # 2. Deploy your app binaries and views
      - name: Deploy application files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.BRAYS_FTP_SERVER }}
          username: ${{ secrets.BRAYS_FTP_USERNAME }}
          password: ${{ secrets.BRAYS_FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: ${{ secrets.BRAYS_FTP_PATH }}
          exclude: |
            **/.git*
            **/.git*/**
            **/appsettings.Development.json
            **/appsettings.json
            app_offline.htm

      # 3. Explicitly delete the app_offline file using a raw FTP command step
      - name: Delete app_offline via FTP command
        uses: benc-uk/workflow-dispatch@v1 # Alternative clean bash script execution
        run: |
          curl -u "${{ secrets.BRAYS_FTP_USERNAME }}:${{ secrets.BRAYS_FTP_PASSWORD }}" \
            ftp://${{ secrets.BRAYS_FTP_SERVER }}/${{ secrets.BRAYS_FTP_PATH }}app_offline.htm \
            -X "DELE app_offline.htm" || echo "File already removed or command executed"