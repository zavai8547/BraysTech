name: Deploy BraysTech

on:
  push:
    branches:
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: dotnet publish BraysTech.csproj --configuration Release --output ./publish

      - name: Upload app_offline.htm via curl
        run: |
          echo "<h3>Updating. Back in a moment.</h3>" > /tmp/app_offline.htm
          curl -T /tmp/app_offline.htm \
            ftp://${{ secrets.BRAYS_FTP_SERVER }}/site1/app_offline.htm \
            --user "${{ secrets.BRAYS_FTP_USERNAME }}:${{ secrets.BRAYS_FTP_PASSWORD }}" \
            --ftp-create-dirs \
            --retry 3 \
            --silent

      - name: Wait for IIS to release files
        run: sleep 20

      - name: Deploy all files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.BRAYS_FTP_SERVER }}
          username: ${{ secrets.BRAYS_FTP_USERNAME }}
          password: ${{ secrets.BRAYS_FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /site1/
          timeout: 120000
          retry-count: 3
          exclude: |
            **/.git*
            **/.git*/**
            **/appsettings.Development.json
            **/appsettings.json

      - name: Remove app_offline.htm via curl
        run: |
          curl -X DELETE \
            ftp://${{ secrets.BRAYS_FTP_SERVER }}/site1/app_offline.htm \
            --user "${{ secrets.BRAYS_FTP_USERNAME }}:${{ secrets.BRAYS_FTP_PASSWORD }}" \
            --silent || true