name: Deploy BraysTech

on:
  push:
    branches:
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 1. Clean compilation targeting the project directly
      - name: Publish
        run: dotnet publish BraysTech.csproj --configuration Release --output ./publish

      # 2. Inject the offline file into the publish folder right before syncing.
      # When FTP uploads this first, IIS will catch it and release the lock on your DLLs.
      - name: Inject App Offline File
        run: echo "<h3>Site is updating. Please refresh in a few moments...</h3>" > ./publish/app_offline.htm

      # 3. Main Deployment (Uploads everything, including app_offline.htm)
      - name: Deploy Application Files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.BRAYS_FTP_SERVER }}
          username: ${{ secrets.BRAYS_FTP_USERNAME }}
          password: ${{ secrets.BRAYS_FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /site1/
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/appsettings.Development.json
            **/appsettings.json